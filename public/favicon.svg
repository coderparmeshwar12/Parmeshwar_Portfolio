<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ebb" />
      <stop offset="100%" stop-color="#ff7597" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="cherryGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b81" />
      <stop offset="100%" stop-color="#c81e3a" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark circle backing -->
  <circle cx="50" cy="50" r="48" fill="#12141d" stroke="#ff8fab" stroke-width="2.5" />
  
  <!-- Cupcake liner -->
  <path d="M 28 58 L 33 84 Q 50 88 67 84 L 72 58 Z" fill="url(#cupGrad)" stroke="#a78bfa" stroke-width="1.5" />
  <!-- Pleats -->
  <path d="M 37 59 L 41 84 M 45 59 L 47 85 M 55 59 L 53 85 M 63 59 L 59 84" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cake layer -->
  <ellipse cx="50" cy="58" rx="23" ry="7" fill="#d97706" />

  <!-- Frosting swirls -->
  <path d="M 23 58 C 21 52 30 45 37 47 C 42 41 58 41 63 47 C 70 45 79 52 77 58 C 73 64 27 64 23 58 Z" fill="url(#frostingGrad)" />
  <path d="M 29 48 C 30 41 38 36 45 38 C 48 32 58 32 60 38 C 66 38 71 43 68 49 C 64 52 34 52 29 48 Z" fill="#ffb3c6" />
  <path d="M 37 38 C 39 30 46 26 50 26 C 54 26 61 30 63 38 C 58 42 42 42 37 38 Z" fill="#ffd1dc" />

  <!-- Cherry / Sparkle on top -->
  <circle cx="50" cy="22" r="6" fill="url(#cherryGrad)" filter="url(#softGlow)" />
  <path d="M 50 17 Q 56 10 60 12" stroke="#4ade80" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Sprinkles -->
  <line x1="36" y1="47" x2="40" y2="45" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" />
  <line x1="60" y1="46" x2="64" y2="48" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" />
  <line x1="48" y1="38" x2="52" y2="36" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" />
  <line x1="43" y1="52" x2="47" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Subtle code brackets < / > on the cup -->
  <text x="50" y="76" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.95">&lt;/&gt;</text>
</svg>